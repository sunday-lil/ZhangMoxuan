name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v2.0.1)"
        required: true
        default: "v2.0.1"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish and upload single-file asset
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        run: >
          dotnet publish ZhangMoxuan/ZhangMoxuan.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" publish/ZhangMoxuan.exe --clobber
